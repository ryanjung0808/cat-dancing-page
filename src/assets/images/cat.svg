<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 고양이 몸통 -->
  <ellipse cx="100" cy="130" rx="45" ry="50" fill="#FF9E4F"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="65" r="40" fill="#FF9E4F"/>

  <!-- 왼쪽 귀 -->
  <polygon points="65,35 55,5 80,30" fill="#FF9E4F"/>
  <polygon points="68,32 60,12 77,30" fill="#FFB6C1"/>

  <!-- 오른쪽 귀 -->
  <polygon points="135,35 145,5 120,30" fill="#FF9E4F"/>
  <polygon points="132,32 140,12 123,30" fill="#FFB6C1"/>

  <!-- 왼쪽 눈 -->
  <ellipse cx="82" cy="60" rx="10" ry="12" fill="white"/>
  <circle cx="84" cy="62" r="6" fill="#333"/>
  <circle cx="86" cy="59" r="2" fill="white"/>

  <!-- 오른쪽 눈 -->
  <ellipse cx="118" cy="60" rx="10" ry="12" fill="white"/>
  <circle cx="116" cy="62" r="6" fill="#333"/>
  <circle cx="114" cy="59" r="2" fill="white"/>

  <!-- 코 -->
  <ellipse cx="100" cy="75" rx="6" ry="4" fill="#FF6B6B"/>

  <!-- 입 -->
  <path d="M 90 82 Q 100 92 110 82" stroke="#333" stroke-width="2" fill="none"/>

  <!-- 수염 왼쪽 -->
  <line x1="50" y1="70" x2="75" y2="75" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="75" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="90" x2="75" y2="85" stroke="#333" stroke-width="1.5"/>

  <!-- 수염 오른쪽 -->
  <line x1="150" y1="70" x2="125" y2="75" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="125" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="90" x2="125" y2="85" stroke="#333" stroke-width="1.5"/>

  <!-- 왼쪽 앞다리 -->
  <ellipse cx="70" cy="160" rx="12" ry="25" fill="#FF9E4F"/>
  <ellipse cx="70" cy="182" rx="10" ry="8" fill="#FFB6C1"/>

  <!-- 오른쪽 앞다리 -->
  <ellipse cx="130" cy="160" rx="12" ry="25" fill="#FF9E4F"/>
  <ellipse cx="130" cy="182" rx="10" ry="8" fill="#FFB6C1"/>

  <!-- 꼬리 -->
  <path d="M 145 130 Q 180 100 170 70" stroke="#FF9E4F" stroke-width="15" fill="none" stroke-linecap="round"/>

  <!-- 배 무늬 -->
  <ellipse cx="100" cy="140" rx="25" ry="30" fill="#FFE4B5"/>

  <!-- 볼 홍조 -->
  <circle cx="70" cy="75" r="8" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="130" cy="75" r="8" fill="#FFB6C1" opacity="0.6"/>
</svg>
